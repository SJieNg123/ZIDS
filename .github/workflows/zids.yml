name: ZIDS protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'rules/**'
      - 'legacy/benchmarks/2026-10-05/readiness-report.json'
      - '.gitattributes'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/zids.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'rules/**'
      - 'legacy/benchmarks/2026-10-05/readiness-report.json'
      - '.gitattributes'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/zids.yml'
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.5'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked python tools/setup_reference.py
      - run: uv run --locked python tools/check_crypto.py
      - run: uv run --locked python -B -m unittest discover -s tests -v
      - if: always()
        run: uv cache prune --ci
