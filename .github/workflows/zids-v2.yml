name: ZIDS v2 protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/zids_v2/**'
      - 'tests_v2/**'
      - 'tools/reference*'
      - 'tools/setup_reference.py'
      - 'requirements-v2.txt'
      - '.github/workflows/zids-v2.yml'
  pull_request:
    paths:
      - 'src/zids_v2/**'
      - 'tests_v2/**'
      - 'tools/reference*'
      - 'tools/setup_reference.py'
      - 'requirements-v2.txt'
      - '.github/workflows/zids-v2.yml'
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-v2.txt
      - run: python tools/setup_reference.py
      - run: python tools/check_v2_crypto.py
      - run: python -B -m unittest discover -s tests_v2 -v
