name: ZIDS v2 protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/zids_v2/**'
      - 'tests_v2/**'
      - 'tools/reference*'
      - 'tools/setup_reference.py'
      - 'tools/*_v2.py'
      - 'tools/check_v2_crypto.py'
      - 'tools/verify_benchmark_policies.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/zids-v2.yml'
  pull_request:
    paths:
      - 'src/zids_v2/**'
      - 'tests_v2/**'
      - 'tools/reference*'
      - 'tools/setup_reference.py'
      - 'tools/*_v2.py'
      - 'tools/check_v2_crypto.py'
      - 'tools/verify_benchmark_policies.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/zids-v2.yml'
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.5'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked python tools/setup_reference.py
      - run: uv run --locked python tools/check_v2_crypto.py
      - run: uv run --locked python -B -m unittest discover -s tests_v2 -v
      - if: always()
        run: uv cache prune --ci
